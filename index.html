  <script>

    const t=k=>I18N[lang][k];

    // ==================== TECHNICAL ANALYSIS ENGINE ====================
    class TechnicalAnalyzer {
      constructor(prices) {
        this.prices = prices || this.generateRealisticPrices();
        this.high = this.prices.map(p => p * (1 + Math.random() * 0.005));
        this.low = this.prices.map(p => p * (1 - Math.random() * 0.005));
      }

      generateRealisticPrices(length = 100) {
        const prices = [1.0];
        for (let i = 1; i < length; i++) {
          const change = (Math.random() - 0.5) * 0.002;
          prices.push(Math.max(0.5, prices[i - 1] * (1 + change)));
        }
        return prices;
      }

      // Simple Moving Average
      sma(period = 20) {
        const result = [];
        for (let i = 0; i < this.prices.length; i++) {
          if (i < period - 1) continue;
          const sum = this.prices.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
          result.push(sum / period);
        }
        return result;
      }

      // Exponential Moving Average
      ema(period = 12) {
        const k = 2 / (period + 1);
        let ema = this.sma(period)[0];
        const result = [];
        for (let i = period - 1; i < this.prices.length; i++) {
          ema = this.prices[i] * k + ema * (1 - k);
          result.push(ema);
        }
        return result;
      }

      // RSI - Relative Strength Index
      rsi(period = 14) {
        const deltas = [];
        for (let i = 1; i < this.prices.length; i++) {
          deltas.push(this.prices[i] - this.prices[i - 1]);
        }

        let gains = 0, losses = 0;
        for (let i = 0; i < period; i++) {
          if (deltas[i] > 0) gains += deltas[i];
          else losses -= deltas[i];
        }

        const result = [];
        let avgGain = gains / period;
        let avgLoss = losses / period;

        for (let i = period; i < deltas.length; i++) {
          if (deltas[i] > 0) gains = deltas[i];
          else gains = 0;
          if (deltas[i] < 0) losses = -deltas[i];
          else losses = 0;

          avgGain = (avgGain * (period - 1) + gains) / period;
          avgLoss = (avgLoss * (period - 1) + losses) / period;

          const rs = avgGain / (avgLoss || 0.0001);
          const rsi = 100 - (100 / (1 + rs));
          result.push(rsi);
        }
        return result;
      }

      // MACD
      macd() {
        const ema12 = this.ema(12);
        const ema26 = this.ema(26);
        const macdLine = [];
        const minLen = Math.min(ema12.length, ema26.length);

        for (let i = 0; i < minLen; i++) {
          macdLine.push(ema12[ema12.length - minLen + i] - ema26[ema26.length - minLen + i]);
        }

        const signal = [];
        const k = 2 / 10;
        let sig = macdLine[0];
        for (let i = 0; i < macdLine.length; i++) {
          sig = macdLine[i] * k + sig * (1 - k);
          signal.push(sig);
        }

        const histogram = macdLine.map((m, i) => m - signal[i]);
        return { macd: macdLine, signal, histogram };
      }

      // Bollinger Bands
      bollingerBands(period = 20, stdDevs = 2) {
        const smaData = this.sma(period);
        const upper = [], lower = [];

        for (let i = period - 1; i < this.prices.length; i++) {
          const subset = this.prices.slice(i - period + 1, i + 1);
          const mean = subset.reduce((a, b) => a + b) / period;
          const variance = subset.reduce((sq, n) => sq + Math.pow(n - mean, 2), 0) / period;
          const stdDev = Math.sqrt(variance);
          upper.push(mean + stdDev * stdDevs);
          lower.push(mean - stdDev * stdDevs);
        }
        return { upper, middle: smaData, lower };
      }

      // ZigZag Pattern Detection
      zigzag(threshold = 2) {
        const pivots = [];
        let direction = 0;
        let lastPivot = { idx: 0, price: this.prices[0], type: 'low' };

        for (let i = 1; i < this.prices.length; i++) {
          const change = ((this.prices[i] - lastPivot.price) / lastPivot.price) * 100;

          if (Math.abs(change) > threshold) {
            if (change > 0 && direction !== 1) {
              pivots.push(lastPivot);
              lastPivot = { idx: i, price: this.prices[i], type: 'high' };
              direction = 1;
            } else if (change < 0 && direction !== -1) {
              pivots.push(lastPivot);
              lastPivot = { idx: i, price: this.prices[i], type: 'low' };
              direction = -1;
            }
          }
        }
        pivots.push(lastPivot);
        return pivots;
      }

      // Support and Resistance
      supportResistance() {
        const pivots = this.zigzag();
        const support = pivots.filter(p => p.type === 'low').map(p => p.price);
        const resistance = pivots.filter(p => p.type === 'high').map(p => p.price);
        return {
          support: Math.min(...support),
          resistance: Math.max(...resistance)
        };
      }

      // Generate comprehensive signal
      generateSignal(pair) {
        const current = this.prices[this.prices.length - 1];
        const sma20 = this.sma(20);
        const sma50 = this.sma(50);
        const rsi14 = this.rsi(14);
        const { upper, lower } = this.bollingerBands();
        const { macd, signal } = this.macd();
        const { support, resistance } = this.supportResistance();

        let scores = {
          trend: 0,
          momentum: 0,
          volatility: 0,
          bands: 0,
          zigzag: 0
        };

        // Trend Analysis
        if (sma20.length > 0 && sma50.length > 0) {
          const lastSma20 = sma20[sma20.length - 1];
          const lastSma50 = sma50[sma50.length - 1];
          if (current > lastSma20 && lastSma20 > lastSma50) {
            scores.trend = 80;
          } else if (current < lastSma20 && lastSma20 < lastSma50) {
            scores.trend = -80;
          } else {
            scores.trend = current > lastSma20 ? 40 : -40;
          }
        }

        // RSI Analysis
        if (rsi14.length > 0) {
          const lastRsi = rsi14[rsi14.length - 1];
          if (lastRsi < 30) scores.momentum = 70;
          else if (lastRsi > 70) scores.momentum = -70;
          else scores.momentum = (50 - lastRsi) * 1.4;
        }

        // Bollinger Bands
        if (upper.length > 0 && lower.length > 0) {
          const lastUpper = upper[upper.length - 1];
          const lastLower = lower[lower.length - 1];
          if (current < lastLower) scores.bands = 60;
          else if (current > lastUpper) scores.bands = -60;
        }

        // MACD
        if (macd.length > 0) {
          const lastMacd = macd[macd.length - 1];
          const lastSignal = signal[signal.length - 1];
          scores.zigzag = lastMacd > lastSignal ? 50 : -50;
        }

        const direction = (scores.trend + scores.momentum + scores.bands + scores.zigzag) > 0 ? 'call' : 'put';
        const confidence = Math.min(100, Math.abs(scores.trend + scores.momentum + scores.bands + scores.zigzag) / 2.8);

        return {
          pair: pair.toUpperCase(),
          direction,
          confidence: Math.round(confidence),
          rsi: rsi14.length > 0 ? Math.round(rsi14[rsi14.length - 1]) : 50,
          trend: scores.trend > 0 ? 'BULLISH' : 'BEARISH',
          support,
          resistance,
          volatility: Math.round((upper[upper.length - 1] - lower[lower.length - 1]) / current * 100 * 100) / 100
        };
      }
    }

    // ==================== UI AND LOGIC ====================
    const PAIRS=['EUR/USD','GBP/USD','USD/JPY','AUD/USD','USD/CAD','EUR/GBP','GBP/JPY','AUD/JPY','BTC/USD','ETH/USD','USD/MAD-OTC','CHF/NOK-OTC','EUR/USD-OTC','GBP/USD-OTC','USD/JPY-OTC','AUD/CAD-OTC'];

    let wins=0,losses=0,startCapital=+$('capital-input').value||100,capital=startCapital;
    const PAYOUT=.92;
    try{const s=JSON.parse(localStorage.getItem('qi2026')||'null');if(s){wins=s.wins||0;losses=s.losses||0;capital=s.capital??capital;}}catch(e){}
    const save=()=>localStorage.setItem('qi2026',JSON.stringify({wins,losses,capital}));

    function applyLang(){
      document.documentElement.lang=lang;
      document.documentElement.dir=lang==='ar'?'rtl':'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
      $('lang-btn').textContent=lang==='ar'?'EN':'AR';

    $('lang-btn').onclick=()=>{lang=lang==='ar'?'en':'ar';applyLang();};

    function renderTop(){
      const ranked=PAIRS.map(p=>({p,score:Math.floor(Math.random()*100)})).sort((a,b)=>b.score-a.score).slice(0,5);
      const box=$('top-pairs');box.innerHTML='';
      ranked.forEach(r=>{
        const c=document.createElement('div');c.className='chip';
        c.innerHTML=r.p+' <span class="s">'+r.score+'%</span>';
        c.onclick=()=>{$('pair-input').value=r.p;};
        box.appendChild(c);

    $('tf').onchange=renderTop;

    function tick(){
      const tf=+$('tf').value;
      const now=Math.floor(Date.now()/1000);
      const timeLeft=tf-(now%tf);
      $('timer-label').textContent='⏱ '+timeLeft+'s';
    }
    setInterval(tick,250);tick();

    $('scan-btn').onclick=()=>{
      const pair=$('pair-input').value.trim();
      if(!pair){
        $('log').textContent=lang==='ar'?'⚠️ أدخل الزوج أو اختره من المقترحات':'⚠️ Enter a pair or pick a suggestion';
        $('log').classList.add('error');
        return;
      }
      $('scan-btn').disabled=true;
      $('signal').classList.add('hidden');
      $('log').textContent='';
      $('log').classList.remove('error','success');

      const steps=t('steps');
      let i=0;
      const iv=setInterval(()=>{
        if(i<steps.length){
          $('log').textContent+=steps[i++]+'\n';
        } else {
          clearInterval(iv);
          const analyzer=new TechnicalAnalyzer();
          const result=analyzer.generateSignal(pair);

          $('sig-pair').textContent=result.pair;
          $('sig-dir').className='dir '+result.direction;
          $('sig-dir').textContent=t(result.direction);
          $('sig-conf').textContent=t('conf')+': '+result.confidence+'%';
          $('conf-bar').style.width=result.confidence+'%';
          $('conf-bar').style.background=result.direction==='call'?'#22c55e':'#ef4444';

          // Analysis metrics
          const metrics=[
            {label:t('trend'),value:result.trend,icon:'📈'},
            {label:'RSI',value:result.rsi,icon:'📊'},
            {label:t('vol'),value:result.volatility+'%',icon:'🌊'},
            {label:'Support',value:result.support.toFixed(4),icon:'🔻'},
            {label:'Resistance',value:result.resistance.toFixed(4),icon:'🔺'}
          ];
          const grid=$('analysis-metrics');
          grid.innerHTML=metrics.map(m=>`
            <div class="analysis-item">
              ${m.icon} ${m.label}
              <b>${m.value}</b>
            </div>
          `).join('');

          // Indicators
          const ind=$('indicators');
          ind.innerHTML=`
            <div class="m"><span>SMA 20/50</span><b>${result.trend}</b></div>
            <div class="m alert"><span>RSI(14)</span><b>${result.rsi}</b></div>
            <div class="m"><span>Entry Price</span><b>${result.pair}</b></div>
            <div class="m success"><span>Duration</span><b>1 Candle</b></div>
          `;

          $('signal').classList.remove('hidden');
          $('signal').classList.toggle('strong', result.confidence > 70);
          $('signal').classList.toggle('weak', result.confidence < 50);
          $('win-btn').classList.remove('disabled');
          $('loss-btn').classList.remove('disabled');
          $('scan-btn').disabled=false;

          $('log').textContent=lang==='ar'?'✅ تم تحليل الإشارة بنجاح':'✅ Signal analyzed successfully';
          $('log').classList.add('success');
        }
      },400);
    };

    function record(win){
      const stake=+$('stake-input').value||1;
      if(win){wins++;capital+=stake*PAYOUT;}else{losses++;capital-=stake;}
      $('win-btn').classList.add('disabled');
      $('loss-btn').classList.add('disabled');
      updateStats();
      save();
    }
    $('win-btn').onclick=()=>record(true);
    $('loss-btn').onclick=()=>record(false);

    function updateStats(){
      const n=wins+losses;
      $('total-trades').textContent=n;
      $('success-rate').textContent=n?Math.round(wins/n*100)+'%':'0%';
      $('total-wins').textContent=wins;
      $('total-losses').textContent=losses;
      const pl=capital-startCapital;
      $('profit-loss').textContent=(pl>=0?'+$':'-$')+Math.abs(pl).toFixed(2);
      $('total-capital').textContent='$'+capital.toFixed(2);
    }
    $('capital-input').onchange=()=>{
      startCapital=+$('capital-input').value||100;
      capital=startCapital;
      updateStats();
      save();
    };
    $('reset-btn').onclick=()=>{
      if(!confirm(lang==='ar'?'هل تريد تصفير البيانات؟':'Are you sure?'))return;
      wins=0;losses=0;startCapital=+$('capital-input').value||100;capital=startCapital;
      updateStats();
      save();
    };

    applyLang();updateStats();
  </script>
</body>
</html>
